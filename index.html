<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GABRIELDESOUZAOLIVEIRA — Vision AI</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    :root {
      --bg:        #080c10;
      --surface:   #0e1420;
      --border:    #1c2535;
      --accent:    #00f5c4;
      --accent2:   #0077ff;
      --danger:    #ff3e6c;
      --text:      #e8edf5;
      --muted:     #5a6a80;
      --radius:    14px;
      --glow:      0 0 24px rgba(0,245,196,.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Grain overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: .5;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.4rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(1rem, 3vw, 1.4rem);
      letter-spacing: .08em;
      color: var(--text);
      text-transform: uppercase;
    }

    .logo span { color: var(--accent); }

    .badge-ai {
      font-family: 'Space Mono', monospace;
      font-size: .65rem;
      letter-spacing: .12em;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 2px 8px;
      text-transform: uppercase;
      animation: pulse-border 2.4s ease-in-out infinite;
    }

    @keyframes pulse-border {
      0%,100% { box-shadow: 0 0 0px rgba(0,245,196,0); }
      50%      { box-shadow: 0 0 10px rgba(0,245,196,.4); }
    }

    /* ── Main layout ── */
    main {
      padding: 2.5rem 1rem 4rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .section-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: .75rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    /* ── Webcam card ── */
    .cam-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    .cam-card .cam-header {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .85rem 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    .dot { width:9px; height:9px; border-radius:50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #28c840; }

    .cam-label {
      font-size: .7rem;
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-left: auto;
    }

    #webcam-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 230px;
      padding: 1.5rem;
      background: #070b0f;
    }

    #webcam-container canvas {
      border-radius: 10px;
      border: 1px solid var(--border);
      max-width: 100%;
      height: auto;
      box-shadow: var(--glow);
    }

    /* placeholder when camera not started */
    .cam-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .06em;
    }

    .cam-placeholder i {
      font-size: 3rem;
      color: var(--border);
    }

    /* ── Start button ── */
    .btn-start {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: .9rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 50px;
      padding: .8rem 2.2rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .18s, box-shadow .18s;
    }

    .btn-start::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.15);
      opacity: 0;
      transition: opacity .18s;
    }

    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(0,245,196,.35); }
    .btn-start:hover::after { opacity: 1; }
    .btn-start:active { transform: translateY(0); }

    .btn-start.running {
      background: linear-gradient(135deg, #0077ff, #00c6b8);
      animation: btn-pulse 2s ease-in-out infinite;
    }

    @keyframes btn-pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,118,255,.4); }
      50%      { box-shadow: 0 0 0 10px rgba(0,118,255,0); }
    }

    /* spinner inside button */
    .spinner-ring {
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,.3);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    .btn-start.loading .spinner-ring { display: block; }
    .btn-start.loading .btn-icon { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results card ── */
    .results-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem 1.6rem;
    }

    .result-item {
      margin-bottom: 1.1rem;
    }

    .result-item:last-child { margin-bottom: 0; }

    .result-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: .42rem;
    }

    .result-name {
      font-size: .78rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text);
    }

    .result-pct {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: .95rem;
      color: var(--accent);
      min-width: 3.5ch;
      text-align: right;
      transition: color .3s;
    }

    /* Custom progress bar */
    .prog-track {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      border-radius: 999px;
      width: 0%;
      transition: width .35s cubic-bezier(.4,0,.2,1), background .35s;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
    }

    .prog-fill.high  { background: linear-gradient(90deg, var(--accent2), var(--accent)); }
    .prog-fill.mid   { background: linear-gradient(90deg, #ffbd2e, #ff7c3e); }
    .prog-fill.low   { background: linear-gradient(90deg, var(--muted), #3a4a5e); }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .68rem;
      letter-spacing: .1em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 1.6rem;
    }

    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      transition: background .4s;
    }

    .status-dot.active {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: .3; }
    }

    /* ── Divider ── */
    .vr-sep {
      width: 1px;
      background: var(--border);
      align-self: stretch;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: .65rem;
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    footer span { color: var(--accent); }

    /* ── Responsive ── */
    @media (max-width: 576px) {
      header { padding: 1rem; }
      main { padding: 1.5rem .75rem 3rem; }
      .results-card { padding: 1.1rem 1rem; }
    }
  </style>
</head>
<body>

<!-- ════ HEADER ════ -->
<header>
  <div class="logo">Gabriel<span>.</span>DeSOUZA<span>.</span>OLIVEIRA</div>
  <div class="badge-ai"><i class="bi bi-cpu me-1"></i>Vision AI</div>
</header>

<!-- ════ MAIN ════ -->
<main>
  <div class="row g-4">

    <!-- ── Webcam column ── -->
    <div class="col-12 col-md-6">
      <p class="section-title"><i class="bi bi-camera-video me-1"></i>câmera ao vivo</p>

      <div class="cam-card mb-3">
        <div class="cam-header">
          <div class="dot dot-r"></div>
          <div class="dot dot-y"></div>
          <div class="dot dot-g"></div>
          <span class="cam-label">feed / 200×200</span>
        </div>
        <div id="webcam-container">
          <div class="cam-placeholder" id="cam-placeholder">
            <i class="bi bi-webcam"></i>
            <span>Câmera inativa</span>
          </div>
        </div>
      </div>

      <!-- Start button -->
      <div class="d-flex justify-content-center">
        <button class="btn-start" id="btn-start" onclick="init()">
          <span class="spinner-ring"></span>
          <i class="bi bi-camera-fill btn-icon"></i>
          <span class="btn-text">Ativar câmera</span>
        </button>
      </div>

      <!-- Status bar -->
      <div class="status-bar justify-content-center mt-3">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">aguardando inicialização</span>
      </div>
    </div>

    <!-- ── Results column ── -->
    <div class="col-12 col-md-6">
      <p class="section-title"><i class="bi bi-bar-chart-line me-1"></i>predições do modelo</p>

      <div class="results-card">
        <div id="label-container">
          <!-- Populated dynamically -->
          <div class="cam-placeholder" style="padding: 1rem 0;">
            <i class="bi bi-graph-up" style="font-size:2rem;"></i>
            <span>Inicie a câmera para ver as predições</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- ════ FOOTER ════ -->
<footer>
  Powered by <span>Teachable Machine</span> + TensorFlow.js &nbsp;·&nbsp; © 2024 Gabriel de Souza Oliveira
</footer>

<!-- ════ SCRIPTS ════ -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
  const URL = "https://teachablemachine.withgoogle.com/models/13Wdi3wCL/";
  let model, webcam, maxPredictions;
  let started = false;

  const btnStart    = document.getElementById('btn-start');
  const btnText     = btnStart.querySelector('.btn-text');
  const btnIcon     = btnStart.querySelector('.btn-icon');
  const statusDot   = document.getElementById('status-dot');
  const statusText  = document.getElementById('status-text');
  const labelCont   = document.getElementById('label-container');
  const webcamCont  = document.getElementById('webcam-container');
  const placeholder = document.getElementById('cam-placeholder');

  function setStatus(msg, active = false) {
    statusText.textContent = msg;
    statusDot.classList.toggle('active', active);
  }

  async function init() {
    if (started) return;
    started = true;

    // Button → loading state
    btnStart.classList.add('loading');
    btnText.textContent = 'Carregando…';
    btnStart.disabled = true;
    setStatus('carregando modelo…', false);

    try {
      model = await tmImage.load(URL + "model.json", URL + "metadata.json");
      maxPredictions = model.getTotalClasses();

      webcam = new tmImage.Webcam(200, 200, true);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);

      // Swap placeholder → canvas
      placeholder && placeholder.remove();
      webcamCont.appendChild(webcam.canvas);

      // Build prediction rows
      labelCont.innerHTML = '';
      for (let i = 0; i < maxPredictions; i++) {
        labelCont.appendChild(buildRow(i));
      }

      // Button → running state
      btnStart.classList.remove('loading');
      btnStart.classList.add('running');
      btnText.textContent = 'Transmitindo';
      btnIcon.className = 'bi bi-broadcast btn-icon';
      setStatus('modelo ativo — inferência em tempo real', true);

    } catch (err) {
      console.error(err);
      started = false;
      btnStart.classList.remove('loading');
      btnStart.disabled = false;
      btnText.textContent = 'Tentar novamente';
      setStatus('erro ao inicializar — verifique as permissões', false);
    }
  }

  function buildRow(i) {
    const wrap = document.createElement('div');
    wrap.className = 'result-item';
    wrap.id = `row-${i}`;
    wrap.innerHTML = `
      <div class="result-meta">
        <span class="result-name" id="name-${i}">Classe ${i + 1}</span>
        <span class="result-pct" id="pct-${i}">0%</span>
      </div>
      <div class="prog-track">
        <div class="prog-fill low" id="fill-${i}"></div>
      </div>`;
    return wrap;
  }

  async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
  }

  async function predict() {
    const prediction = await model.predict(webcam.canvas);
    for (let i = 0; i < maxPredictions; i++) {
      const p    = prediction[i];
      const pct  = Math.round(p.probability * 100);
      const fill = document.getElementById(`fill-${i}`);
      const pctEl = document.getElementById(`pct-${i}`);
      const nameEl = document.getElementById(`name-${i}`);

      if (nameEl) nameEl.textContent = p.className;
      if (pctEl)  pctEl.textContent  = pct + '%';

      if (fill) {
        fill.style.width = pct + '%';
        fill.className = 'prog-fill ' + (pct >= 60 ? 'high' : pct >= 30 ? 'mid' : 'low');
      }
    }
  }
</script>

</body>
</html>
